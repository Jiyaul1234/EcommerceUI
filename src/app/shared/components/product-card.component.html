<div class="card product-card h-100">
  <div class="position-relative product-image-container">
    <img [src]="product.image" [alt]="product.name" class="card-img-top">
    <span *ngIf="getDiscountPercentage() > 0" class="badge bg-danger position-absolute top-0 end-0 m-2">
      -{{ getDiscountPercentage() }}%
    </span>
    <span *ngIf="!product.inStock" class="badge bg-secondary position-absolute top-50 start-50 translate-middle">
      Out of Stock
    </span>
  </div>
  <div class="card-body d-flex flex-column">
    <h5 class="card-title text-truncate">{{ product.name }}</h5>
    <div class="product-price mb-3">
      <ng-template #regularPrice>
        <span class="price">{{ product.price | currency }}</span>
      </ng-template>
    </div>
    <div class="mt-auto">
      <button class="btn btn-primary btn-sm w-100 mb-2" 
        (click)="onAddToCart()" 
        [disabled]="!product.inStock">
        <span class="material-icons icon-small">add_shopping_cart</span>
        Add to Cart
      </button>
      <button class="btn btn-outline-primary btn-sm w-100" (click)="onViewDetails()">
        <span class="material-icons icon-small">visibility</span>
        View Details
      </button>
    </div>
  </div>
</div>
