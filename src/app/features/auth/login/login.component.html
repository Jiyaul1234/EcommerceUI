<div class="login-container">
  <div class="login-wrapper">
    <div class="login-box">
      <h2 class="text-center mb-4">Welcome Back</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="form-group mb-3">
          <label for="email" class="form-label">
            <span class="material-icons">email</span> Email Address
          </label>
          <input type="email" class="form-control" id="email" formControlName="email"
            [class.is-invalid]="f['email'].invalid && (f['email'].dirty || f['email'].touched)">
          <div class="invalid-feedback" *ngIf="f['email'].invalid && (f['email'].dirty || f['email'].touched)">
            <span *ngIf="f['email'].errors?.['required']">Email is required</span>
            <span *ngIf="f['email'].errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group mb-3">
          <label for="password" class="form-label">
            <span class="material-icons">lock</span> Password
          </label>
          <input type="password" class="form-control" id="password" formControlName="password"
            [class.is-invalid]="f['password'].invalid && (f['password'].dirty || f['password'].touched)">
          <div class="invalid-feedback" *ngIf="f['password'].invalid && (f['password'].dirty || f['password'].touched)">
            <span *ngIf="f['password'].errors?.['required']">Password is required</span>
            <span *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <!-- Remember Me -->
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="rememberMe" formControlName="rememberMe">
          <label class="form-check-label" for="rememberMe">
            Remember me
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" [disabled]="isLoading">
          <span *ngIf="!isLoading" class="material-icons">login</span>
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          {{ isLoading ? 'Logging In...' : 'Login' }}
        </button>
      </form>

      <!-- Forgot Password Link -->
      <div class="text-center mb-3">
        <a href="javascript:void(0)" (click)="forgotPassword()" class="text-decoration-none">
          Forgot Password?
        </a>
      </div>

      <!-- Divider -->
      <div class="divider mb-3">OR</div>

      <!-- Sign Up Link -->
      <p class="text-center">
        Don't have an account?
        <a routerLink="/register" class="text-decoration-none">Sign Up</a>
      </p>
    </div>
  </div>
</div>
